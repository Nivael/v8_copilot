[project]
name = "st-research-copilot"
version = "0.1.0"
description = "Private evidence-grounded ST research copilot"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
