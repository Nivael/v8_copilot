[project]
name = "st-research-copilot"
version = "0.1.0"
description = "Private evidence-grounded ST research copilot"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=1.26,<3",
  "openai>=2.45.0",
  "pandas>=2.2,<4",
  "pydantic>=2.13.4,<3",
  "python-dotenv>=1.2.2",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
